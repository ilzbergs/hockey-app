services:
  backend:
    build:
      context: ./backend
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
    depends_on:
      - pocketbase

  pocketbase:
    build:
      context: ./backend/pocketbase
    ports:
      - '8090:8090'
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:80'
    environment:
      VITE_API_BASE_URL: http://65.109.11.244/api
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  pb_data:
